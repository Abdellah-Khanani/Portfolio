<!doctype html><meta charset="utf-8">
<title>Logo sizing sheet</title>
<style>
  body{margin:0;background:#000;color:#fff;font:12px/1.4 -apple-system,system-ui,sans-serif}
  h2{font:11px/1 monospace;letter-spacing:.14em;text-transform:uppercase;color:#888;padding:18px 20px 0;margin:0}
  .row{display:flex;flex-wrap:wrap;align-items:center;gap:56px;padding:22px 20px;border-bottom:1px solid #222}
  figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:8px}
  img{height:72px;width:auto;object-fit:contain;filter:grayscale(1);opacity:.85}
  figcaption{font:10px/1 monospace;color:#777}
  .box img{outline:1px solid #2a2a2a}
</style>
