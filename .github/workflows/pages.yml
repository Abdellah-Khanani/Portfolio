# Publishes the contents of v3/ to GitHub Pages on every push to main.
# The site lands at the domain root: v3/index.html becomes /index.html.
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Assemble the site
        run: |
          mkdir _site
          # everything in v3/ except the private design notes
          rsync -a --exclude '.design' v3/ _site/
          test -f _site/index.html   # fail loudly rather than publish an empty site

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
