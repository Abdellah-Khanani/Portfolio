<style>
/* radius rule: panels 14px, inputs 10px, every chip/button a full pill */
:root{
 --side:#0e2528; --side2:#143235; --bg:#f3f4f2; --surf:#fff; --surf2:#f8f9f7; --ink:#14201f; --ink2:#3a4745; --mute:#6c7775; --line:#e3e7e4; --line2:#eef1ee;
 --acc:#e9805f; --acc-d:#d26745; --acc-ink:#2a120a; --acc-soft:#fcebe4;
 --ok:#2f7d6b; --ok-bg:#e2f1ec; --wait:#a8710f; --wait-bg:#fbf0d9; --in:#2c5d8a; --in-bg:#e3edf6; --no:#b4473a; --no-bg:#f8e4e1; --off:#8a9391; --off-bg:#eef0ee;
 --disp:"Tenor Sans",system-ui,sans-serif; --sans:"Hanken Grotesk",system-ui,sans-serif; --r:14px; --sh:0 1px 2px rgba(20,32,31,.04),0 8px 24px -12px rgba(20,32,31,.12);
 --ease:cubic-bezier(.16,1,.3,1);
 --deep:#0e2528; --deep2:#1b3b3d; --deep-ink:#e8ece9; --deep-mute:#9fb5b0; --bar:#c6d5d2;
 --side-bg:#fbfbfa; --side-ink:#14201f; --side-mute:#76817f; --side-dim:#a3abaa; --side-hov:#f0f2f0; --side-act:#fff; --side-line:#e6e9e6; --side-sh:0 1px 2px rgba(20,32,31,.06),0 6px 16px -8px rgba(20,32,31,.18);
}
:root[data-theme=dark]{--side-bg:#0e2528;--side-ink:#e8ece9;--side-mute:#b9c8c4;--side-dim:#6f8a85;--side-hov:rgba(255,255,255,.05);--side-act:#143235;--side-line:transparent;--side-sh:none;--deep:#173836;--deep2:#22484a;--bar:#4d7472;--bg:#0b1716;--surf:#122220;--surf2:#152826;--ink:#e9ece9;--ink2:#c3cbc8;--mute:#8d9a97;--line:#223633;--line2:#1b2e2b;--ok-bg:#163a31;--wait-bg:#3a2e14;--in-bg:#16293b;--no-bg:#3b1d19;--off-bg:#1d2e2c;--acc-soft:#3a2219;--sh:0 1px 2px rgba(0,0,0,.2),0 10px 30px -14px rgba(0,0,0,.5)}

/* themes ?stile=a|b|c: same panel, the colours, fonts and radius of the matching site */
:root[data-stile]{--mono:"T"}
:root[data-stile=c]{--mono:"E"}
:root[data-stile=a]{--side:#2b1d14;--side2:#3a2417;--bg:#f3ead8;--surf:#fbf6ea;--surf2:#f7f0e0;--ink:#2b1d14;--ink2:#4d3b2e;--mute:#6f5c4a;--line:#e0d4bb;--line2:#ebe1cb;--acc:#c4562f;--acc-d:#a9441f;--acc-ink:#fff;--acc-soft:#f6dccf;--ok:#356b3f;--ok-bg:#e1ecd6;--wait:#8f5c0c;--wait-bg:#f8e6bf;--in:#2f5f85;--in-bg:#dfe9ee;--no:#a63a2a;--no-bg:#f3d9d0;--off:#7d6f5e;--off-bg:#ebe2d0;--disp:"Fraunces",Georgia,serif;--sans:"DM Sans",system-ui,sans-serif;--r:20px;--deep:#3a2417;--deep2:#54351f;--deep-ink:#f3ead8;--deep-mute:#cdb99c;--bar:#d9c6a4;--side-bg:#efe4cc;--side-ink:#2b1d14;--side-mute:#64513f;--side-dim:#9a8870;--side-hov:rgba(43,29,20,.06);--side-act:#fbf6ea;--side-line:#e0d4bb;--sh:0 1px 2px rgba(43,29,20,.05),0 8px 24px -12px rgba(43,29,20,.18)}
:root[data-stile=a][data-theme=dark]{--bg:#1e140e;--surf:#2a1d14;--surf2:#30221a;--ink:#f3ead8;--ink2:#d8ccb4;--mute:#b4a58d;--line:#44322a;--line2:#38281f;--acc-soft:#4a2517;--ok:#9fd0a8;--ok-bg:#26391f;--wait:#ecc274;--wait-bg:#43321a;--in:#9cc0de;--in-bg:#1f3140;--no:#f0a496;--no-bg:#4a231c;--off:#b4a58d;--off-bg:#33281f;--deep:#3a2417;--deep2:#54351f;--bar:#7a5a3c;--side-bg:#170f0a;--side-ink:#f3ead8;--side-mute:#cbbca0;--side-dim:#8a7a62;--side-hov:rgba(255,255,255,.05);--side-act:#2a1d14;--side-line:transparent;--side-sh:none}
:root[data-stile=b]{--side:#0f1d2b;--bg:#e9e2d0;--surf:#f4efe1;--surf2:#efe9d8;--ink:#0f1d2b;--ink2:#2b3a4a;--mute:#566474;--line:#d8cfb8;--line2:#e2dac5;--acc:#b8944f;--acc-d:#a07d3a;--acc-ink:#0f1d2b;--acc-soft:#f1e6c8;--ok:#2d6a58;--ok-bg:#d9e9df;--wait:#80570a;--wait-bg:#f3e4b8;--in:#2a5a85;--in-bg:#d9e5ee;--no:#9c3b30;--no-bg:#f1d9d2;--off:#6b7480;--off-bg:#e1dccb;--disp:"Bodoni Moda",Georgia,serif;--sans:"DM Sans",system-ui,sans-serif;--r:6px;--deep:#0f1d2b;--deep2:#1d3248;--deep-ink:#e9e2d0;--deep-mute:#a9b6c1;--bar:#c9a96e;--side-bg:#0f1d2b;--side-ink:#e9e2d0;--side-mute:#b3c0cb;--side-dim:#6f8294;--side-hov:rgba(255,255,255,.06);--side-act:#1d3248;--side-line:transparent;--side-sh:none;--sh:0 1px 2px rgba(15,29,43,.06),0 8px 24px -12px rgba(15,29,43,.2)}
:root[data-stile=b][data-theme=dark]{--bg:#0b1622;--surf:#132434;--surf2:#172a3c;--ink:#e9e2d0;--ink2:#cfd3d0;--mute:#9fb0bd;--line:#25394b;--line2:#1d2f40;--acc:#c9a96e;--acc-d:#b5935a;--acc-soft:#2e2a1f;--ok:#8fd0b8;--ok-bg:#15372f;--wait:#e8c273;--wait-bg:#3a2f15;--in:#95bde0;--in-bg:#16293b;--no:#f0a094;--no-bg:#3b1d19;--off:#9fb0bd;--off-bg:#1b2c3b;--deep:#132434;--deep2:#1d3248;--bar:#5b7387;--side-bg:#0f1d2b;--side-act:#1d3248;--sh:0 1px 2px rgba(0,0,0,.25),0 10px 30px -14px rgba(0,0,0,.6)}
:root[data-stile=c]{--side:#111;--bg:#fbfbf7;--surf:#fff;--surf2:#f6f6ef;--ink:#111;--ink2:#333;--mute:#5f5f55;--line:#e1e1d6;--line2:#ecece2;--acc:#e94f2b;--acc-d:#c93d1b;--acc-ink:#111;--acc-soft:#ffe3d9;--ok:#1b7339;--ok-bg:#dcf3e0;--wait:#7d5200;--wait-bg:#ffefb0;--in:#1d55a8;--in-bg:#dde9fa;--no:#b3261e;--no-bg:#fde0dc;--off:#5f5f55;--off-bg:#ececE2;--disp:"Space Grotesk",system-ui,sans-serif;--sans:"Space Grotesk",system-ui,sans-serif;--r:10px;--deep:#111;--deep2:#2a2a2a;--deep-ink:#fbfbf7;--deep-mute:#b9b9ad;--bar:#ffd23f;--side-bg:#fff;--side-ink:#111;--side-mute:#4d4d44;--side-dim:#8c8c80;--side-hov:#f3f3ea;--side-act:#ffd23f;--side-line:#111;--side-sh:none;--sh:0 1px 0 rgba(17,17,17,.08),0 6px 18px -12px rgba(17,17,17,.25)}
:root[data-stile=c][data-theme=dark]{--bg:#0d0d0d;--surf:#1a1a1a;--surf2:#202020;--ink:#fbfbf7;--ink2:#dcdcd2;--mute:#a8a89c;--line:#333;--line2:#262626;--acc-soft:#3b1d14;--ok:#7bd196;--ok-bg:#14301c;--wait:#ffd23f;--wait-bg:#3a3010;--in:#8fb8ee;--in-bg:#13264a;--no:#ff9b91;--no-bg:#401a16;--off:#a8a89c;--off-bg:#262626;--deep:#1a1a1a;--deep2:#2a2a2a;--bar:#ffd23f;--side-bg:#000;--side-ink:#fbfbf7;--side-mute:#c9c9be;--side-dim:#7c7c70;--side-hov:rgba(255,255,255,.07);--side-act:#2a2a2a;--side-line:#333;--sh:none}
:root[data-stile=c] .brand b::after{background:#ffd23f;width:10px;height:10px;box-shadow:0 0 0 2px #111}
@media(min-width:1281px){:root[data-stile=a] .brand b,:root[data-stile=b] .brand b{letter-spacing:.02em;font-size:20px}:root[data-stile=c] .brand b{letter-spacing:-.01em;font-weight:700;font-size:20px}}
:root[data-stile=c] .brand b::before{font-weight:700}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--sans);-webkit-font-smoothing:antialiased;font-feature-settings:"tnum" 1}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.ph{font-size:18px;line-height:1}
.num{font-variant-numeric:tabular-nums}

/* shell */
.app{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
.side{background:var(--side-bg);color:var(--side-ink);border-right:1px solid var(--side-line);display:flex;flex-direction:column;padding:22px 14px;position:sticky;top:0;height:100vh}
.brand{padding:6px 12px 26px}
.brand b{display:flex;align-items:center;gap:10px;font:400 17px var(--disp);letter-spacing:.32em}
.brand b::after{content:"";width:6px;height:6px;border-radius:50%;background:var(--acc)}
.brand span{font-size:12px;color:var(--side-mute);letter-spacing:.04em}
.nav{display:grid;gap:2px}
.nav button{position:relative;display:flex;align-items:center;gap:12px;height:44px;padding:0 12px;border:0;border-radius:11px;background:none;color:var(--side-mute);font-weight:500;text-align:left;transition:background .25s,color .25s,box-shadow .25s}
.nav button:hover{background:var(--side-hov);color:var(--side-ink)}
.nav button[aria-current=page]{background:var(--side-act);color:var(--side-ink);box-shadow:inset 3px 0 0 var(--acc),var(--side-sh)}
.nav button[aria-current=page] .ph{color:var(--acc)}
.nav .ls{display:none}
.nav .cnt{margin-left:auto;min-width:22px;height:22px;padding:0 7px;border-radius:999px;background:var(--acc);color:var(--acc-ink);font-size:12px;font-weight:700;display:grid;place-items:center}
.nav-h{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--side-dim);padding:20px 12px 8px}
.side-foot{margin-top:auto;display:grid;gap:10px}
.live{display:flex;align-items:center;gap:10px;padding:12px;border-radius:12px;background:var(--side-act);box-shadow:var(--side-sh);font-size:13px;color:var(--side-mute)}
.live i.dot{width:8px;height:8px;border-radius:50%;background:#5fd1a8;box-shadow:0 0 0 4px rgba(95,209,168,.15)}
.me{display:flex;align-items:center;gap:12px;padding:8px 6px}
.av{width:36px;height:36px;border-radius:50%;background:var(--acc);color:var(--acc-ink);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.me div{line-height:1.25;font-size:14px}.me small{color:var(--side-mute);font-size:12px}

.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top-in{height:72px;display:flex;align-items:center;gap:14px;padding:0 28px}
.top h1{font:400 22px var(--disp);letter-spacing:.02em;margin:0;white-space:nowrap}
.top .date{color:var(--mute);font-size:14px;white-space:nowrap}
.top .sp{flex:1}
.search{display:flex;align-items:center;gap:8px;height:42px;padding:0 14px;border-radius:999px;background:var(--surf);border:1px solid var(--line);width:260px}
.search input{border:0;outline:0;background:none;width:100%}
.icon-btn{position:relative;width:44px;height:44px;border-radius:999px;border:1px solid var(--line);background:var(--surf);display:grid;place-items:center}
.icon-btn .badge{position:absolute;top:-3px;right:-3px;min-width:18px;height:18px;border-radius:999px;background:var(--acc);color:var(--acc-ink);font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 5px}
.content{padding:28px 28px 130px;max-width:1440px;width:100%}

/* generic */
.btn{text-decoration:none;color:inherit;display:inline-flex;align-items:center;justify-content:center;gap:8px;height:42px;padding:0 18px;border-radius:999px;border:1px solid transparent;font-weight:600;font-size:14px;white-space:nowrap;transition:background .2s,border-color .2s,transform .15s}
.btn:active{transform:scale(.98)}
.btn.pri{background:var(--acc);color:var(--acc-ink)}.btn.pri:hover{background:var(--acc-d);color:#fff}
.btn.sec{background:var(--surf);border-color:var(--line)}.btn.sec:hover{border-color:var(--mute)}
.btn.ghost{background:none}.btn.ghost:hover{background:var(--line2)}
.btn.ok{background:var(--ok);color:#fff}.btn.no{background:var(--no-bg);color:var(--no)}
.btn.sm{height:34px;padding:0 13px;font-size:13px}
.card{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.card-h{display:flex;align-items:center;gap:12px;padding:18px 20px 0}
.card-h h2{font-size:16px;font-weight:600;margin:0}
.card-h .sp{flex:1}
.card-b{padding:18px 20px 20px}
.mute{color:var(--mute)}
.pill{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.s-pending{background:var(--wait-bg);color:var(--wait)}.s-confirmed{background:var(--ok-bg);color:var(--ok)}.s-seated{background:var(--in-bg);color:var(--in)}.s-cancelled{background:var(--no-bg);color:var(--no)}.s-done{background:var(--off-bg);color:var(--off)}
.tag{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:999px;background:var(--line2);color:var(--ink2);font-size:12px;font-weight:600}
.seg{display:inline-flex;padding:4px;border-radius:999px;background:var(--surf);border:1px solid var(--line);gap:2px}
.seg button{height:34px;padding:0 14px;border:0;border-radius:999px;background:none;font-weight:600;font-size:13px;color:var(--mute);display:flex;align-items:center;gap:6px}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--surf)}
.seg button .c{font-size:11px;opacity:.75}
.sw{position:relative;width:42px;height:24px;flex:none}
.sw input{position:absolute;opacity:0;inset:-10px -4px;width:calc(100% + 8px);height:44px;margin:0;cursor:pointer;z-index:1}
.sw span{position:absolute;inset:0;border-radius:999px;background:var(--line);transition:background .25s}
.sw span::after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .3s var(--ease)}
.sw input:checked+span{background:var(--ok)}
.sw input:checked+span::after{transform:translateX(18px)}
.sw input:focus-visible+span{outline:2px solid var(--acc);outline-offset:2px}
.f{display:grid;gap:6px;font-size:13px;font-weight:600;color:var(--ink2)}
.f small{font-weight:400;color:var(--mute)}
.in{height:42px;padding:0 13px;border-radius:10px;border:1px solid var(--line);background:var(--surf);width:100%;outline:0;transition:border-color .2s,box-shadow .2s}
textarea.in{height:auto;padding:11px 13px;resize:vertical;min-height:84px}
.in:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.empty{padding:40px 20px;text-align:center;color:var(--mute)}
.empty .ph{font-size:30px;display:block;margin:0 auto 10px;color:var(--line)}
.view{display:none;animation:vin .45s var(--ease)}
.view.on{display:block}
@keyframes vin{from{opacity:0;transform:translateY(6px)}}
@media (prefers-reduced-motion:reduce){.view{animation:none}}

/* overview */
.hello{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:16px;margin-bottom:24px}
.hello h2{font:400 clamp(26px,3vw,36px)/1.1 var(--disp);margin:0}
.hello p{margin:6px 0 0;color:var(--mute)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:16px}
.kpi{padding:20px}
.kpi .l{display:flex;align-items:center;gap:8px;color:var(--mute);font-size:13px;font-weight:600}
.kpi .l .ph{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--line2);color:var(--ink2);font-size:16px}
.kpi b{display:block;font:500 34px/1 var(--sans);margin:16px 0 6px;letter-spacing:-.02em}
.kpi small{color:var(--mute);font-size:13px}
.kpi.hi{background:var(--deep);color:var(--deep-ink);border-color:var(--deep);position:relative;overflow:hidden}
.kpi.hi::after{content:"";position:absolute;right:-60px;top:-60px;width:180px;height:180px;border-radius:50%;border:1px solid rgba(233,128,95,.25);box-shadow:0 0 0 26px rgba(233,128,95,.05)}
.kpi.hi .l{color:var(--deep-mute)}.kpi.hi .l .ph{background:var(--deep2);color:var(--acc)}.kpi.hi small{color:var(--deep-mute)}
.meter{height:6px;border-radius:999px;background:var(--deep2);margin-top:12px;overflow:hidden}
.meter i{display:block;height:100%;border-radius:999px;background:var(--acc);transition:width 1s var(--ease)}
.ov-g{display:grid;grid-template-columns:1.6fr 1fr;gap:16px}
.ov-g2{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;margin-top:16px}
.chart{width:100%;height:220px;display:block}
.chart text{font:12px var(--sans);fill:var(--mute)}
.list{list-style:none;margin:0;padding:0}
.li{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line2)}
.li:first-child{border-top:0}
.li .t{font-weight:700;width:48px;flex:none}
.li .who{flex:1;min-width:0}
.li .who b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .who small{color:var(--mute)}
.fish-mini{display:flex;gap:14px;align-items:center}
.fish-mini .img{width:84px;height:84px;border-radius:12px;background:var(--line2) center/cover;flex:none}

/* reservations */
.toolbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:16px}
.toolbar .sp{flex:1}
.days{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;margin-bottom:16px;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.day{flex:none;width:86px;padding:12px 8px;border-radius:14px;border:1px solid var(--line);background:var(--surf);text-align:center;transition:all .25s var(--ease)}
.day:hover{border-color:var(--mute)}
.day small{display:block;font-size:12px;color:var(--mute);text-transform:capitalize;font-weight:600}
.day b{display:block;font-size:22px;font-weight:600;margin:2px 0}
.day span{font-size:12px;color:var(--mute)}
.day[aria-pressed=true]{background:var(--ink);color:var(--surf);border-color:var(--ink)}
.day[aria-pressed=true] small,.day[aria-pressed=true] span{color:inherit;opacity:.75}
.day.closed{opacity:.5}
.day.closed span{color:var(--no)}
.rtable{width:100%;border-collapse:collapse}
.rtable th{text-align:left;font-size:12px;font-weight:600;color:var(--mute);text-transform:uppercase;letter-spacing:.06em;padding:12px 16px;border-bottom:1px solid var(--line)}
.rtable td{padding:14px 16px;border-bottom:1px solid var(--line2);vertical-align:middle}
.rtable tr.r{cursor:pointer;transition:background .2s}
.rtable tr.r:hover{background:var(--surf2)}
.rtable tr.slot td{padding:18px 16px 8px;font-variant-numeric:tabular-nums;font-size:12px;font-weight:700;color:var(--mute);letter-spacing:.08em;text-transform:uppercase;border-bottom:0;background:none;cursor:default}
.who2{display:flex;align-items:center;gap:12px}
.who2 .av{background:var(--line2);color:var(--ink2);width:34px;height:34px;font-size:12px}
.who2 b{display:block;font-weight:600;white-space:nowrap}
.who2 small{white-space:nowrap}
.tbl-chip,.pill{white-space:nowrap}
