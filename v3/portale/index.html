<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#ECF0F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#080B14" media="(prefers-color-scheme: dark)">
<title>AK Portale</title>
<link rel="icon" type="image/png" href="../assets/logo/ak-icon-48.png">
<link rel="apple-touch-icon" href="../assets/logo/ak-icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/portale.css">
<link rel="stylesheet" href="css/a.css">
<link rel="stylesheet" href="css/b.css">
</head>
<body>
<div id="login" class="login">
  <div class="login-aurora" aria-hidden="true"></div>
  <form class="login-card" novalidate>
    <img src="../assets/logo/ak-mark.webp" alt="AK" class="login-mark" width="81" height="40">
    <h1>Portale</h1>
    <p class="muted">Entra con la stessa mail e password dell'app AK Studio.</p>
    <label class="lbl"><span>Mail</span><input name="email" type="email" autocomplete="username" required></label>
    <label class="lbl"><span>Password</span><input name="password" type="password" autocomplete="current-password" required></label>
    <p class="err" aria-live="polite"></p>
    <button class="btn primary wide" type="submit">Entra</button>
    <button class="linkbtn forgot" type="button">Password dimenticata?</button>
  </form>
</div>

<div class="shell">
  <aside class="side">
    <a class="brand" href="#turno"><img src="../assets/logo/ak-mark.webp" alt="AK" width="54" height="27"><span>Portale</span></a>
    <nav id="nav" aria-label="Sezioni"></nav>
    <div class="side-foot"><span id="me" class="muted"></span><button id="logout" class="linkbtn" type="button">Esci</button></div>
  </aside>
  <main id="view" class="view in" tabindex="-1"></main>
</div>
<script type="module" src="js/main.js"></script>
</body>
</html>
